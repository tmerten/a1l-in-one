name: megademo
base: ubuntu@24.04
sdks:
  - name: uv
  - name: claude-code
  - name: opencode
  - name: vscode-remote
  - name: node
  - name: project-pi
  - name: project-entire
  - name: system
    slots:
      backend:
        interface: tunnel
        endpoint: localhost:8000 # service in the workshop
      frontend:
        interface: tunnel
        endpoint: localhost:5173 # service in the workshop
    plugs:
      backend:
        interface: tunnel
        endpoint: localhost:8000 # port on the host
      frontend:
        interface: tunnel
        endpoint: localhost:5173 # port on the host
actions:
  install: |
    pip install -r /project/requirements.txt "$@"

  test: |
    python -m pytest /project "$@"

  claude: |
    claude --model ${CLAUDE_MODEL:-sonnet} --dangerously-skip-permissions "$@"

  claude-auto: |
    claude --model ${CLAUDE_MODEL:-sonnet} --dangerously-skip-permissions --print "$@"

  opencode: |
    opencode "$@"

  pi: |
    pi "$@"

  entire: |
    entire "$@"
