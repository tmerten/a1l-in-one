name: megademo
base: ubuntu@24.04
sdks:
  - name: direnvrc
  - name: uv
  - name: claude-code
  - name: opencode
  - name: vscode-remote
  - name: node
  # - name: project-pi
  - name: project-entire
    slots:
      backend:
        interface: tunnel
        endpoint: localhost:8000 # service in the workshop
      frontend:
        interface: tunnel
        endpoint: localhost:5173 # service in the workshop
  - name: system
    plugs:
      backend:
        interface: tunnel
        endpoint: localhost:8000 # port on the host
      frontend:
        interface: tunnel
        endpoint: localhost:5173 # port on the host
actions:
  claude: |
    direnv exec /project claude --model ${CLAUDE_MODEL:-sonnet} --dangerously-skip-permissions "$@"

  claude-auto: |
    direnv exec /project claude --model ${CLAUDE_MODEL:-sonnet} --dangerously-skip-permissions --print "$@"

  opencode: |
    direnv exec /project opencode "$@"

  # uninstalled
  # pi: |
    # pi "$@"

  entire: |
    entire "$@"

  # does not work
  backend: |
    /var/lib/workshop/sdk/uv/bin/uv run project-health serve

  # does not work
  frontend: |
    cd frontend && npm run dev
